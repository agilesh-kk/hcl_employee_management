
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Employee</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="form-container">

    <h2>Add New Employee</h2>

    <form id="employeeForm">

        <label for="name">Employee Name</label>
        <input type="text" id="name" placeholder="Enter employee name" required>

        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Enter email" required>

        <label for="department">Department</label>
        <input type="text" id="department" placeholder="Enter department" required>

        <label for="salary">Salary</label>
        <input type="number" id="salary" placeholder="Enter salary"
               min="0.01" step="0.01" required>

        <button type="submit">Save Employee</button>

    </form>

    <p id="formMessage"></p>

    <a href="employees.html">Back to Employees</a>

</div>

<script src="js/employee-form.js"></script>

</body>
</html>
